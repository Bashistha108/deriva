spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  kafka:
    bootstrap-servers: localhost:9094

  datasource:
    url: jdbc:postgresql://localhost:5432/deriva
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 50
      transaction-isolation: TRANSACTION_SERIALIZABLE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: deriva-engine

  distribution:
    percentiles-histogram:
      http.server.requests: true