version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deriva-postgres
    environment:
      POSTGRES_USER: deriva
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deriva
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deriva"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: deriva-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deriva
      - SPRING_DATASOURCE_USERNAME=deriva
      - SPRING_DATASOURCE_PASSWORD=password
      - APP_LOG_PATH=/app/app.log
    volumes:
      - ./app.log:/app/app.log
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deriva-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    volumes:
      - ./app.log:/app/app.log
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm start 2>&1 | awk '{print \"[FRONTEND]: \" $$0}' >> /app/app.log"

volumes:
  pgdata:
