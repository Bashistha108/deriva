spring:
  application:
    name: deriva

  datasource:
    url: jdbc:postgresql://localhost:5432/deriva
    username: deriva
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

logging:
  file:
    name: ${APP_LOG_PATH:../../app.log}
  level:
    root: INFO
    com.deriva: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "[BACKEND]: %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger.%M() - [traceId=%X{traceId}] - %msg%n"
    file: "[BACKEND]: %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger.%M() - [traceId=%X{traceId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
