spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/deriva
    username: deriva
    password: password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9094

yahoo:
  api:
    url: "https://query1.finance.yahoo.com/v7/finance/options"
  data:
    redis:
      host: localhost
      port: 6379
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: deriva-backend

logging:
  level:
    com.deriva: DEBUG
    org.springframework.security: DEBUG
